[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "noteropdf"
version = "0.4.0"
description = "Upload local Zotero PDFs to matching Notion pages managed by Notero"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["notion", "notero", "pdf", "zotero"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Utilities",
]
dependencies = [
  "requests>=2.33,<3",
  "platformdirs>=4.3.8,<5",
  "keyring>=25.7,<26",
  "filelock>=3.16,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<8",
]
qa = [
  "mypy>=1.17,<2",
  "ruff>=0.12,<1",
]
build = [
  "build>=1.2,<2",
  "check-wheel-contents>=0.6,<1",
  "twine>=6,<7",
]
[project.scripts]
noteropdf = "noteropdf.cli:main"

[project.urls]
Homepage = "https://github.com/diyanko/NoteroPDF"
Issues = "https://github.com/diyanko/NoteroPDF/issues"
Source = "https://github.com/diyanko/NoteroPDF"
Changelog = "https://github.com/diyanko/NoteroPDF/blob/main/CHANGELOG.md"
Security = "https://github.com/diyanko/NoteroPDF/security/policy"

[tool.setuptools.packages.find]
include = ["noteropdf*"]

[tool.mypy]
files = ["noteropdf"]
ignore_missing_imports = true
python_version = "3.10"

[tool.ruff]
target-version = "py310"
