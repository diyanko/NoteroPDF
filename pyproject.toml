[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noteropdf"
version = "0.3.1"
description = "Upload local Zotero PDFs to matching Notion pages managed by Notero"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]
dependencies = [
  "PyYAML==6.0.2",
  "python-dotenv==1.0.1",
  "requests==2.32.3",
  "platformdirs==4.3.8",
  "keyring==25.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "build==1.2.2.post1",
  "pyinstaller==6.19.0",
]

[project.scripts]
noteropdf = "noteropdf.cli:main"

[project.urls]
Homepage = "https://github.com/diyanko/NoteroPDF"
Issues = "https://github.com/diyanko/NoteroPDF/issues"
Source = "https://github.com/diyanko/NoteroPDF"

[tool.setuptools.packages.find]
include = ["noteropdf*"]
