name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-dists:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Validate tag, version, and commit
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          tag = os.environ["RELEASE_TAG"]
          if re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+", tag) is None:
              raise SystemExit(f"Release tag must be vMAJOR.MINOR.PATCH, got {tag!r}")
          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match package version {version!r}")
          PY
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Release tags must point to a commit on main." >&2
            exit 1
          }

      - name: Require successful CI for the exact release commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main -f event=push -f head_sha="$GITHUB_SHA" -f per_page=1 \
            | python scripts/check_release_ci.py "$GITHUB_SHA"

      - name: Install build tooling
        run: python -m pip install ".[build]"

      - name: Build distributions
        run: python -m build

      - name: Validate distribution metadata and contents
        run: |
          python -m twine check --strict dist/*
          check-wheel-contents dist/*.whl

      - name: Smoke test installed wheel
        shell: bash
        run: |
          wheel_path="$(realpath "$(find dist -maxdepth 1 -name '*.whl' -print -quit)")"
          expected_version="${GITHUB_REF_NAME#v}"
          python -m venv /tmp/noteropdf-wheel-smoke
          /tmp/noteropdf-wheel-smoke/bin/python -m pip install "$wheel_path"
          cd /tmp
          /tmp/noteropdf-wheel-smoke/bin/python -m pip check
          /tmp/noteropdf-wheel-smoke/bin/python -c "import importlib.metadata as m; assert m.version('noteropdf') == '$expected_version'"
          /tmp/noteropdf-wheel-smoke/bin/noteropdf --help
          /tmp/noteropdf-wheel-smoke/bin/noteropdf --version

      - name: Smoke test source distribution
        shell: bash
        run: |
          sdist_path="$(realpath "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)")"
          expected_version="${GITHUB_REF_NAME#v}"
          python -m venv /tmp/noteropdf-sdist-smoke
          /tmp/noteropdf-sdist-smoke/bin/python -m pip install "$sdist_path"
          cd /tmp
          /tmp/noteropdf-sdist-smoke/bin/python -m pip check
          /tmp/noteropdf-sdist-smoke/bin/python -c "import importlib.metadata as m; assert m.version('noteropdf') == '$expected_version'"
          /tmp/noteropdf-sdist-smoke/bin/noteropdf --help
          /tmp/noteropdf-sdist-smoke/bin/noteropdf --version

      - name: Upload Python distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    needs: build-dists
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/noteropdf
    permissions:
      id-token: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist

      - name: Publish Python distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  publish-release:
    needs:
      - build-dists
      - publish-pypi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            release-artifacts/*.whl
            release-artifacts/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
